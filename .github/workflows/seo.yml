name: Contrôle SEO public
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Contrôler les pages publiées
        run: node scripts/seo-audit.mjs
      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-public
          path: seo/reports/audit-*.json
          retention-days: 90
