name: Vérifier le site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: cobblestar-test-root-only
          MYSQL_DATABASE: cobblestar_link_test
          MYSQL_USER: cobblestar_test
          MYSQL_PASSWORD: cobblestar-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      LINK_TEST_MYSQL_PORT: 3306
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Installer les dépendances du site
        run: npm ci

      - name: Installer les dépendances de l'API
        run: npm --prefix api ci

      - name: Vérifier et construire
        run: npm run ci

      - name: Conserver l'artefact Kinetic
        uses: actions/upload-artifact@v4
        with:
          name: cobblestar-kinetic
          path: deploy/
          if-no-files-found: error
          retention-days: 7

  verify-mod:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: minecraft-mod
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Construire le mod Fabric
        run: bash gradlew clean build --no-daemon

      - name: Conserver le mod serveur
        uses: actions/upload-artifact@v4
        with:
          name: cobblestar-core-fabric-1.21.1
          path: |
            minecraft-mod/build/libs/cobblestar-core-*.jar
            !minecraft-mod/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
